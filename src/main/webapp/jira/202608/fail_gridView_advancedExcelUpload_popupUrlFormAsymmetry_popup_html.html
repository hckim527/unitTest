<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>[FAIL] gridView advancedExcelUpload popupUrl 확인용 커스텀 팝업 화면(.html)</title>
<style>
    body { font-family: "맑은 고딕", Malgun Gothic, sans-serif; font-size: 12px; padding: 10px; margin: 0; }
    #txt_marker { font-weight: bold; font-size: 13px; }
    .row { display: block; margin-top: 6px; word-break: break-all; }
    button { margin-top: 10px; width: 80px; }
</style>
</head>
<body>
<!--
    gridView.advancedExcelUpload(options) 의 options.popupUrl 로 지정하는 커스텀 Excel 파일 선택 팝업 화면(.html)
     - 이 화면이 실제로 렌더되는지만 확인하기 위한 최소 화면이며 파일 선택 / 업로드 기능은 구현하지 않는다.
     - 별도 팝업창으로 열리므로 전달 파라미터는 QueryString 으로 확인하고 닫기는 window.close() 로 처리한다.
-->
<div id="txt_marker">CUSTOM POPUP RENDERED (.html 파일)</div>
<div class="row" id="txt_kind">열린 형태 : 별도 팝업창</div>
<div class="row" id="txt_href"></div>
<div class="row" id="txt_param"></div>
<button type="button" id="btn_closeSelf">닫기</button>
<script type="text/javascript">
(function () {
    document.getElementById("txt_href").innerHTML = "현재 경로 : " + document.location.href;

    var strQuery = document.location.search;
    if (strQuery.charAt(0) === "?") strQuery = strQuery.substring(1);
    document.getElementById("txt_param").innerHTML = "전달 파라미터 : " + (strQuery === "" ? "없음" : decodeURIComponent(strQuery));

    document.getElementById("btn_closeSelf").onclick = function () {
        window.close();
    };
})();
</script>
</body>
</html>
