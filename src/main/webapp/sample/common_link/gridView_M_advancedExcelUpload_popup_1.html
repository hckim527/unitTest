<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>커스텀 Excel 파일 선택 팝업창</title>
<style type="text/css">
	body { margin:0; padding:10px; font-family:"Malgun Gothic", Dotum, sans-serif; font-size:12px; color:#333; }
	.tit { font-size:13px; font-weight:bold; margin-bottom:10px; }
	.desc { margin-top:10px; line-height:1.5; word-break:break-all; }
	button { margin-top:10px; width:80px; height:24px; }
</style>
</head>
<body>
<!--
	gridView.advancedExcelUpload(options) 의 options.popupUrl 로 지정하는 커스텀 Excel 파일 선택 팝업 화면 (.html)
	 - 엔진 기본 팝업창(uiplugin/grid/upload/advancedfileUpload.html) 대신 이 화면이 열리는지 확인하는 용도
	 - wframe 미적용(false) 시 window.open 으로 열리는 별도 팝업창 전용 화면이다
	 - 실제 업로드까지 수행하려면 엔진 규약(파일 input + __uploadForm__ 전송 + returnData 처리)에 맞게 구현해야 한다
-->
<div class="tit">■ 커스텀 Excel 파일 선택 팝업창 (options.popupUrl 확인용)</div>
<div class="desc" id="txt_param"></div>
<div class="desc">실제 파일 업로드를 수행하려면 엔진 규약에 맞게 파일 선택 및 전송 처리를 직접 구현해야 합니다.</div>
<button type="button" id="btn_closeSelf">닫기</button>
<script type="text/javascript">
// advancedExcelUpload 가 전달한 파라미터 출력
//  · 별도 팝업창은 엔진이 popupUrl 뒤에 업로드 정보를 QueryString 으로 붙여 window.open 으로 연다.
(function () {
	var strQuery = document.location.search;
	if (strQuery.charAt(0) === "?") strQuery = strQuery.substring(1);

	var arrParam = strQuery.split("&");
	var arrResult = [];
	for (var i = 0; i < arrParam.length; i++) {
		if (arrParam[i] === "") continue;
		arrResult.push(decodeURIComponent(arrParam[i]));
	}

	document.getElementById("txt_param").innerHTML = "advancedExcelUpload 가 전달한 파라미터 : " + (arrResult.length === 0 ? "없음" : arrResult.join(" , "));

	// 닫기
	//  · 이 화면은 window.open 으로 열린 별도 팝업창에서만 사용하므로 window.close() 로 자기 자신만 닫는다.
	document.getElementById("btn_closeSelf").onclick = function () {
		window.close();
	};
})();
</script>
</body>
</html>
